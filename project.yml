name: SrudzhBogdan
options:
  bundleIdPrefix: com.timofei
  developmentLanguage: en
  knownRegions: [en, ru, Base]
  deploymentTarget:
    iOS: "17.0"
packages:
  LedgerCore:
    path: LedgerCore
targets:
  SrudzhBogdan:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LedgerCore
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timofei.srudzhbogdan
        PRODUCT_NAME: SrudzhBogdan
        INFOPLIST_KEY_CFBundleDisplayName: "Срудж Богдан"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID keeps your finances away from prying eyes."
